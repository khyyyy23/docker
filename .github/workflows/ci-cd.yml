
name: Deploy User App Locally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Check Docker engine
        run: docker info

      - name: Build Ionic image
        run: docker build -t user-crud:latest .

      - name: Remove previous container
        run: docker rm -f user-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name user-crud --restart unless-stopped -p 8100:80 user-crud:latest

      - name: Verify app
        shell: bash
        run: |
          success=false
          for i in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://localhost:8100/ > /dev/null; then
              success=true
              break
            fi
            sleep 2
          done
          if [ "${success:-false}" != true ]; then
            docker logs user-crud
            exit 1
          fi
